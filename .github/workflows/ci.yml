name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taprate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Dummy values so the build can run. Real secrets live only in your hosting provider.
      NEXT_PUBLIC_APP_URL: https://ci.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-000000
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-0000
      LINK_SIGNING_SECRET: ci-link-secret-00000000000000000000000000
      RESPONSE_TOKEN_SECRET: ci-response-secret-0000000000000000000000
      IP_HASH_SALT: ci-ip-hash-salt-0000000000
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taprate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:db
      - run: npm run build
      - run: npm run typecheck
